<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E4007C"><title>Nexo Rosa · Sin conexión</title><body style="font-family:system-ui;padding:50px 24px;max-width:600px;margin:auto;color:#111"><p style="color:#E4007C;font-weight:bold">NEXO ROSA / EIRA</p><h1>El cuidado continúa.</h1><p>Esta página aún no está disponible sin conexión. Vuelve a una página que hayas abierto antes o conéctate para descargar el espacio de trabajo.</p><p><button id="retry" style="background:#E4007C;color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:bold;font-size:16px;cursor:pointer">Restablecer conexión y reintentar</button></p><p><a href="/campo" style="color:#E4007C">Volver a Campo →</a> &nbsp; <a href="/" style="color:#E4007C">Ir al inicio →</a></p><script>
document.getElementById("retry").onclick=async function(){try{localStorage.removeItem("eira-offline");var w=navigator.serviceWorker&&navigator.serviceWorker.controller;if(w){await new Promise(function(done){var c=new MessageChannel();c.port1.onmessage=done;w.postMessage({type:"OFFLINE",value:false},[c.port2]);setTimeout(done,1500)})}}catch(e){}location.reload()};
</script></body></html>
